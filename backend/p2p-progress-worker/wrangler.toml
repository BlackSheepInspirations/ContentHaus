# Reference config for the P2P cross-device progress Worker.
#
# NOTE: the live Worker was created/deployed through the Cloudflare DASHBOARD, and
# its variables are set there (Workers & Pages → p2p-progress → Settings → Variables),
# NOT via this file. This toml is kept only as documentation / for optional CLI use.
#
# Worker variables (dashboard → Settings → Variables and Secrets):
#   shop           = blacksheepcreationsllc.myshopify.com   (plain text)
#   client_id      = <the app's Client ID>                  (plain text)
#   client_secret  = <the app's Secret>                     (Encrypt / secret)
#   admin_token    = <optional shpat_…>                     (Encrypt / secret; optional)
# API version is hardcoded in worker.js (const API_VERSION = '2026-07').

name = "p2p-progress"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
shop = "blacksheepcreationsllc.myshopify.com"
