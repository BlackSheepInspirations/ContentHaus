<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt Haus — Local Dev Preview</title>
<link rel="stylesheet" href="../assets/prompt-builder.css" />
</head>
<body>
<!-- Dev-only harness: mirrors what sections/prompt-builder.liquid mounts,
     so we can preview in a plain browser before Shopify CLI is set up.
     Not part of the shipped theme. -->
<div id="prompt-haus-app"></div>
<script>
  // Cache-bust on every load during local dev so edited asset files are
  // always picked up without a manual hard-refresh.
  var v = Date.now();
  [
    "../assets/prompt-builder-styledna.js",
    "../assets/prompt-builder-engine.js",
    "../assets/prompt-builder-favorites.js",
    "../assets/prompt-builder-character.js",
    "../assets/prompt-builder-text.js",
    "../assets/prompt-builder-ui.js",
  ].forEach(function (src) {
    document.write('<script src="' + src + '?v=' + v + '"></' + 'script>');
  });
</script>
</body>
</html>
