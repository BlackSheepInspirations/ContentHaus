<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt Haus — Local Dev Preview</title>
<link rel="stylesheet" href="../assets/prompt-builder.css" id="ph-css-link" />
</head>
<body>
<!-- Dev-only harness: mirrors what sections/prompt-builder.liquid mounts,
     so we can preview in a plain browser before Shopify CLI is set up.
     Not part of the shipped theme. -->
<div class="ph-brand-header">
  <div class="ph-marketing__hero">
    <p class="ph-marketing__eyebrow">Black Sheep Creations &amp; Inspirations</p>
    <h1 class="ph-marketing__heading">The <span class="ph-heading-accent">AI</span> Creator's Prompt Haus</h1>
    <div class="ph-marketing__subheading">Turn your ideas into ready-to-use AI prompts for art, products, content, branding, and creative projects. Customized your way.</div>
  </div>
</div>
<div id="prompt-haus-app"></div>
<script>
  // Cache-bust on every load during local dev so edited asset files are
  // always picked up without a manual hard-refresh.
  var v = Date.now();
  document.getElementById("ph-css-link").href = "../assets/prompt-builder.css?v=" + v;
  [
    "../assets/prompt-builder-styledna.js",
    "../assets/prompt-builder-engine.js",
    "../assets/prompt-builder-favorites.js",
    "../assets/prompt-builder-character.js",
    "../assets/prompt-builder-text.js",
    "../assets/prompt-builder-couples.js",
    "../assets/prompt-builder-family.js",
    "../assets/prompt-builder-combined.js",
    "../assets/prompt-builder-graphics.js",
    "../assets/prompt-builder-reference.js",
    "../assets/prompt-builder-animals.js",
    "../assets/prompt-builder-brandkit.js",
    "../assets/prompt-builder-logo.js",
    "../assets/prompt-builder-ui.js",
  ].forEach(function (src) {
    document.write('<script src="' + src + '?v=' + v + '"></' + 'script>');
  });
</script>
</body>
</html>
