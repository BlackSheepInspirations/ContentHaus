<!doctype html><html><head><meta charset="utf-8"><title>OS Notebook</title><style>body{margin:0;background:#050a10;padding:24px;}</style></head><body>
<div id="p2pos" class="osx"><main class="osx-main" style="max-height:none"><section class="osx-view on" data-view="notebook">
  <div class="osx-kick">Notebook</div>
  <h2 class="osx-h2">Your Notebook</h2>
  <p class="osx-lede">Jot ideas, plans, and notes as you build. Give each a title so you can find it again later.</p>
  <div class="osx-nb" data-osx-nb>
    <div class="osx-nb-compose">
      <input class="osx-nb-title" data-nb-title type="text" placeholder="Title — e.g. &ldquo;Spring launch campaign&rdquo;" maxlength="120">
      <textarea class="osx-nb-body" data-nb-body rows="4" placeholder="Jot your idea, plan, or note&hellip;"></textarea>
      <div class="osx-nb-actions"><button class="osx-nb-save" type="button" data-nb-save>Save note</button><button class="osx-nb-cancel" type="button" data-nb-cancel hidden>Cancel</button></div>
    </div>
    <div class="osx-nb-searchrow"><input class="osx-nb-search" data-nb-search type="search" placeholder="Search your notes&hellip;"><span class="osx-nb-count" data-nb-count></span></div>
    <div class="osx-nb-list" data-nb-list></div>
    <div class="osx-nb-empty" data-nb-empty hidden>No notes yet — your first idea goes above. &#10022;</div>
  </div>
</section></main></div>
<style>
  #p2pos.osx{--text:#e7efeb;--muted:#8aa0a6;--gold:#c9a24a;--gold-bright:#f4c534;--stroke:rgba(255,255,255,.09);--gstroke:rgba(216,180,90,.38);color:var(--text);font-family:system-ui,-apple-system,sans-serif;max-width:820px;margin:0 auto;}
  #p2pos .osx-kick{font:700 12px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
  #p2pos .osx-h2{font:700 26px/1.15 Georgia,serif;margin:0 0 8px;}
  #p2pos .osx-lede{font:400 15px/1.6 system-ui;color:#c6d6d0;max-width:640px;margin:0 0 22px;}
  #p2pos .osx-nb-compose{border:1px solid var(--gstroke);border-radius:16px;padding:16px;background:linear-gradient(180deg,rgba(216,180,90,.05),rgba(9,17,24,.4));margin-bottom:18px;}
  #p2pos .osx-nb-title,#p2pos .osx-nb-body,#p2pos .osx-nb-search{width:100%;box-sizing:border-box;background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:10px;color:var(--text);font:400 14px/1.5 system-ui;padding:11px 13px;}
  #p2pos .osx-nb-title{font-weight:700;margin-bottom:9px;}
  #p2pos .osx-nb-body{resize:vertical;min-height:84px;}
  #p2pos .osx-nb-title:focus,#p2pos .osx-nb-body:focus,#p2pos .osx-nb-search:focus{outline:none;border-color:var(--gstroke);}
  #p2pos .osx-nb-actions{display:flex;gap:9px;margin-top:11px;}
  #p2pos .osx-nb-save{padding:10px 20px;border:0;border-radius:10px;font:800 13px/1 system-ui;color:#0a1410;cursor:pointer;background:linear-gradient(145deg,#f4e2a6,var(--gold));}
  #p2pos .osx-nb-cancel{padding:10px 16px;border:1px solid var(--stroke);border-radius:10px;background:none;color:var(--muted);font:600 13px/1 system-ui;cursor:pointer;}
  #p2pos .osx-nb-searchrow{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  #p2pos .osx-nb-search{flex:1;}
  #p2pos .osx-nb-count{font:600 11.5px/1 system-ui;color:var(--muted);white-space:nowrap;}
  #p2pos .osx-nb-list{display:flex;flex-direction:column;gap:10px;}
  #p2pos .osx-nb-item{border:1px solid var(--stroke);border-radius:13px;padding:14px 16px;background:rgba(255,255,255,.02);}
  #p2pos .osx-nb-ihead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  #p2pos .osx-nb-ititle{font:700 15px/1.25 system-ui;color:var(--text);}
  #p2pos .osx-nb-idate{font:600 10.5px/1 system-ui;color:var(--muted);white-space:nowrap;}
  #p2pos .osx-nb-ibody{margin:6px 0 0;font:400 13px/1.55 system-ui;color:#c6d6d0;white-space:pre-wrap;overflow-wrap:anywhere;}
  #p2pos .osx-nb-irow{display:flex;gap:14px;margin-top:11px;}
  #p2pos .osx-nb-irow button{background:none;border:0;padding:0;font:700 12px/1 system-ui;cursor:pointer;color:var(--gold-bright);}
  #p2pos .osx-nb-irow button.del{color:#d6707a;}
  #p2pos .osx-nb-empty{margin-top:8px;padding:24px;text-align:center;font:400 13.5px/1.5 system-ui;color:var(--muted);border:1px dashed var(--stroke);border-radius:13px;}
</style>
<script>
  var root=document.getElementById('p2pos');var nb=root.querySelector('[data-osx-nb]');var NK='p2p_os_notebook_demo';
  var elTitle=nb.querySelector('[data-nb-title]'),elBody=nb.querySelector('[data-nb-body]'),elSave=nb.querySelector('[data-nb-save]'),elCancel=nb.querySelector('[data-nb-cancel]'),elSearch=nb.querySelector('[data-nb-search]'),elList=nb.querySelector('[data-nb-list]'),elCount=nb.querySelector('[data-nb-count]'),elEmpty=nb.querySelector('[data-nb-empty]');
  var editing=null;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function load(){try{return JSON.parse(localStorage.getItem(NK)||'[]')||[];}catch(e){return[];}}
  function save(a){try{localStorage.setItem(NK,JSON.stringify(a));}catch(e){}}
  function fmt(ts){try{return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}catch(e){return'';}}
  function reset(){editing=null;elTitle.value='';elBody.value='';elCancel.hidden=true;elSave.textContent='Save note';}
  function render(){var notes=load(),q=(elSearch.value||'').trim().toLowerCase();var shown=notes.filter(function(n){return!q||(n.title+' '+n.body).toLowerCase().indexOf(q)!==-1;});elCount.textContent=notes.length?(q?shown.length+' of '+notes.length:notes.length+(notes.length===1?' note':' notes')):'';elEmpty.hidden=notes.length!==0;elList.innerHTML=shown.map(function(n){return'<div class="osx-nb-item" data-id="'+n.id+'"><div class="osx-nb-ihead"><span class="osx-nb-ititle">'+(esc(n.title)||'<em style="color:var(--muted)">Untitled</em>')+'</span><span class="osx-nb-idate">'+fmt(n.ts)+'</span></div>'+(n.body?'<p class="osx-nb-ibody">'+esc(n.body)+'</p>':'')+'<div class="osx-nb-irow"><button data-edit>Edit</button><button class="del" data-del>Delete</button></div></div>';}).join('');}
  elSave.addEventListener('click',function(){var title=(elTitle.value||'').trim(),body=(elBody.value||'').trim();if(!title&&!body)return;var notes=load();if(editing){notes=notes.map(function(n){return n.id===editing?Object.assign({},n,{title:title,body:body,ts:Date.now()}):n;});}else{notes.unshift({id:'n'+Date.now()+Math.random().toString(36).slice(2,6),title:title,body:body,ts:Date.now()});}save(notes);reset();render();});
  elCancel.addEventListener('click',reset);
  elSearch.addEventListener('input',render);
  elList.addEventListener('click',function(e){var item=e.target.closest('[data-id]');if(!item)return;var id=item.getAttribute('data-id');if(e.target.hasAttribute('data-edit')){var n=load().filter(function(x){return x.id===id;})[0];if(!n)return;editing=id;elTitle.value=n.title||'';elBody.value=n.body||'';elCancel.hidden=false;elSave.textContent='Update note';elTitle.focus();}else if(e.target.hasAttribute('data-del')){if(!window.confirm('Delete this note?'))return;save(load().filter(function(x){return x.id!==id;}));if(editing===id)reset();render();}});
  render();
  // seed a couple demo notes for the screenshot
  if(!load().length){save([{id:'d1',title:'Spring launch campaign',body:'Teaser week: 3 posts + email. Open cart Friday. Bundle the planner + stickers.',ts:Date.now()},{id:'d2',title:'Product idea — devotional journal',body:'90-day guided, KDP + digital. Tie to the ROOTED framework.',ts:Date.now()-86400000}]);render();}
</script>
</body></html>
