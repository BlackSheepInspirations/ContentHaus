<!doctype html><html><head><meta charset="utf-8"><title>OS hero carousel</title><style>body{margin:0;background:#050a10;padding:24px;}</style></head><body>
<div id="p2pos" class="osx"><main class="osx-main" style="max-height:none">
  <section class="osx-view on" data-view="start">
    <header class="osx-hero">
      <div class="osx-hero-glow"></div>
      <div class="osx-hero-in">
        <div class="osx-eyebrow">Purpose 2 Profit</div>
        <h1>Your journey starts here<span class="osx-name">, Andrea</span></h1>
        <p class="osx-hero-body">This is your home — built around you. Your fingerprint, your spark, your story.</p>
        <div class="osx-hero-btns"><button class="osx-cta">Show me around →</button><a class="osx-cta ghost" href="#">Enter your Learning Journey →</a></div>
        <div class="osx-moments" data-osx-moments hidden>
          <div class="mo-title" data-mo-title></div>
          <blockquote class="mo-text" data-mo-text></blockquote>
          <cite class="mo-source" data-mo-source></cite>
          <div class="mo-foot"><div class="mo-dots" data-mo-dots></div><button class="mo-next" type="button" data-mo-next aria-label="Next check">›</button></div>
        </div>
      </div>
      <aside class="osx-hero-dna" data-osx-dna hidden></aside>
    </header>
  </section>
</main></div>
<style>
  #p2pos.osx{--text:#e7efeb;--muted:#8aa0a6;--gold:#c9a24a;--gold-bright:#f4c534;--stroke:rgba(255,255,255,.09);--gstroke:rgba(216,180,90,.38);--aurora:linear-gradient(100deg,#f4e2a6,#8f6fd6,#27ae6e,#39c5c0,#2563eb,#d6336c,#f4e2a6);color:var(--text);font-family:system-ui;max-width:1000px;margin:0 auto;}
  @keyframes p2pos-shift{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  #p2pos .osx-hero{position:relative;border-radius:20px;overflow:hidden;padding:40px 34px;display:flex;gap:30px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,rgba(143,111,214,.16),rgba(57,197,192,.08)),#0a141c;}
  #p2pos .osx-hero-glow{position:absolute;inset:-40% -10% auto -10%;height:60%;background:radial-gradient(50% 100% at 30% 0%,rgba(143,111,214,.5),transparent 70%),radial-gradient(50% 100% at 75% 10%,rgba(57,197,192,.4),transparent 70%);filter:blur(20px);opacity:.6;pointer-events:none;}
  #p2pos .osx-hero-in{position:relative;flex:1;min-width:280px;}
  #p2pos .osx-eyebrow{font:700 11px/1 system-ui;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
  #p2pos .osx-hero h1{font:700 clamp(28px,4.5vw,40px)/1.1 Georgia,serif;margin:0 0 12px;}
  #p2pos .osx-name{background:var(--aurora);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:p2pos-shift 20s linear infinite;}
  #p2pos .osx-hero-body{font:400 15px/1.6 system-ui;color:#dbe7e2;max-width:560px;margin:0 0 18px;}
  #p2pos .osx-hero-btns{display:flex;gap:12px;flex-wrap:wrap;}
  #p2pos .osx-cta{display:inline-block;padding:13px 24px;border:0;border-radius:12px;font:800 13px/1 system-ui;color:#0a1410;cursor:pointer;background:var(--aurora);background-size:300% 100%;animation:p2pos-shift 20s linear infinite;text-decoration:none;}
  #p2pos .osx-cta.ghost{background:transparent;border:1px solid var(--gstroke);color:var(--gold-bright);animation:none;}
  #p2pos .osx-hero-dna{position:relative;flex:0 0 300px;max-width:340px;}
  #p2pos .osx-hero-dna.is-result{border:1px solid var(--gstroke);border-radius:18px;padding:16px;background:rgba(5,10,16,.5);}
  #p2pos .osx-hero-dna .dna-img{border-radius:12px;overflow:hidden;aspect-ratio:4/3;margin-bottom:12px;border:1px solid var(--stroke);}
  #p2pos .osx-hero-dna .dna-img img{width:100%;height:100%;object-fit:cover;display:block;}
  #p2pos .osx-hero-dna .dna-kick{font:700 10px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  #p2pos .osx-hero-dna .dna-name{font:700 22px/1.1 Georgia,serif;background:var(--aurora);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:p2pos-shift 20s linear infinite;}
  #p2pos .osx-hero-dna .dna-word{font:800 11px/1 system-ui;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-bright);margin-top:5px;}
  #p2pos .osx-hero-dna .dna-traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
  #p2pos .osx-hero-dna .dna-trait{font:600 10.5px/1 system-ui;color:#dbe7e2;background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:20px;padding:6px 10px;}
  #p2pos .osx-hero-dna .dna-link{display:inline-block;margin-top:12px;font:700 11.5px/1 system-ui;color:var(--gold-bright);text-decoration:none;}
  #p2pos .osx-moments{margin-top:22px;border:1px solid var(--gstroke);border-radius:14px;padding:15px 18px;background:rgba(5,10,16,.45);}
  #p2pos .mo-title{font:700 10.5px/1.2 system-ui;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);margin-bottom:9px;}
  #p2pos .mo-star{color:var(--gold-bright);}
  #p2pos .mo-grad{background:var(--aurora);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:p2pos-shift 20s linear infinite;}
  #p2pos .mo-text{font:italic 400 15px/1.5 Georgia,serif;color:var(--text);margin:0 0 7px;min-height:2.9em;}
  #p2pos .mo-source{font:600 11.5px/1.3 system-ui;color:var(--muted);font-style:normal;}
  #p2pos .mo-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;}
  #p2pos .mo-dots{display:flex;gap:7px;}
  #p2pos .mo-dot{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.22);cursor:pointer;transition:background .15s,transform .15s;}
  #p2pos .mo-dot.on{background:var(--gold-bright);transform:scale(1.25);}
  #p2pos .mo-next{width:30px;height:30px;border-radius:50%;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--gold-bright);font:700 18px/1 system-ui;cursor:pointer;display:grid;place-items:center;}
</style>
<script src="../assets/p2p-moments.js"></script>
<script src="../assets/p2p-purpose.js"></script>
<script src="../assets/p2p-heart.js"></script>
<script>
  var root=document.getElementById('p2pos');
  // DNA card (result state)
  (function(){var dna=root.querySelector('[data-osx-dna]');dna.className='osx-hero-dna is-result';
    dna.innerHTML='<div class="dna-img"><img src="../assets/brand-haus-hero-bold-pioneer.jpg" alt=""></div><div class="dna-meta"><div class="dna-kick">Your Brand DNA</div><div class="dna-name">The Bold Pioneer</div><div class="dna-word">Courage</div><div class="dna-traits"><span class="dna-trait">Creativity</span><span class="dna-trait">Originality</span><span class="dna-trait">Innovation</span></div><a class="dna-link" href="#">Refresh your assessment →</a></div>';dna.hidden=false;})();
  // carousel
  (function(){
    var wrap=root.querySelector('[data-osx-moments]');if(!wrap)return;
    var day=Math.floor(Date.now()/864e5);
    var pillars=[{label:'Mindset',pool:window.P2P_MOMENTS},{label:'Purpose',pool:window.P2P_PURPOSE},{label:'Heart',pool:window.P2P_HEART}].filter(function(p){return p.pool&&p.pool.length;});
    var titleEl=wrap.querySelector('[data-mo-title]'),textEl=wrap.querySelector('[data-mo-text]'),srcEl=wrap.querySelector('[data-mo-source]'),dotsWrap=wrap.querySelector('[data-mo-dots]');
    dotsWrap.innerHTML=pillars.map(function(_,di){return '<button class="mo-dot'+(di===0?' on':'')+'" type="button"></button>';}).join('');
    var dots=dotsWrap.querySelectorAll('.mo-dot');var i=0,timer=null;
    function render(){var p=pillars[i],it=p.pool[day%p.pool.length]||{};titleEl.innerHTML='<span class="mo-star">✦</span> <span class="mo-grad">'+p.label+'</span> Check';textEl.textContent=it.t?('“'+it.t+'”'):'';srcEl.textContent=it.s||'';dots.forEach(function(d,di){d.classList.toggle('on',di===i);});}
    function go(n){i=((n%pillars.length)+pillars.length)%pillars.length;render();}
    function next(){go(i+1);}function stop(){if(timer){clearInterval(timer);timer=null;}}function start(){stop();timer=setInterval(next,9000);}
    wrap.querySelector('[data-mo-next]').addEventListener('click',function(){next();start();});
    dots.forEach(function(d,di){d.addEventListener('click',function(){go(di);start();});});
    wrap.addEventListener('mouseenter',stop);wrap.addEventListener('mouseleave',start);
    render();wrap.hidden=false;start();
    window.__moGo=go; // for test
  })();
</script>
</body></html>
