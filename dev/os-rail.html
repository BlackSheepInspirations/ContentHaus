<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flipbook-in-lesson preview</title>
<style>
 body{margin:0;background:radial-gradient(45% 40% at 12% 8%,rgba(39,174,110,.14),transparent 60%),radial-gradient(40% 38% at 88% 14%,rgba(143,111,214,.13),transparent 60%),linear-gradient(180deg,#0a1311,#0a0f0c);min-height:100vh;font-family:system-ui;padding:26px;}
 #p2pp{--gold:#d8b45a;--text:#eef6f3;--muted:#9fb3ad;--panel:rgba(12,22,28,.82);--stroke:rgba(255,255,255,.10);max-width:820px;margin:0 auto;}
 .content{background:var(--panel);border:1px solid var(--stroke);border-radius:18px;padding:28px 30px;color:var(--text);}
 .lhead h1{font:700 25px/1.15 Georgia,serif;margin:0 0 18px;}
 .embed-label{font:700 11px/1 system-ui;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin:0 0 10px;}
 .embed{position:relative;width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;margin-bottom:22px;border:1px solid var(--stroke);background:#0b1620;}
 .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
 .rt{font-size:15px;line-height:1.65;color:#cfe0da;}
 .rt strong{color:#f4e2a6;}
</style></head><body>
<div id="p2pp">
  <main class="content">
    <div class="lhead"><h1>What POD Actually Means</h1></div>
    <div class="embed-label">Read the flip-book</div>
    <div class="embed"><iframe src="https://lucky-cake-08fb.hidden-butterfly-bde8.workers.dev/" allow="fullscreen; clipboard-write" allowfullscreen loading="lazy" title="What POD Actually Means"></iframe></div>
    <div class="rt"><p>Flip through the guide above — use the arrows, or the fullscreen button in the corner for a bigger read. Move on when you're ready.</p></div>
  </main>
</div>
</body></html>
