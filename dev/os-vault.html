<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OS Vault harness</title>
<style>
  body{margin:0;background:radial-gradient(120% 80% at 0% 0%,#0d1a26,#050a10);min-height:100vh;}
  #p2pos{--text:#e7efeb;--muted:#8aa0a6;--gold:#c9a24a;--gold-bright:#f4c534;--stroke:rgba(255,255,255,.09);--gstroke:rgba(216,180,90,.38);
    --aurora:linear-gradient(100deg,#f4e2a6,#8f6fd6,#27ae6e,#39c5c0,#2563eb,#d6336c,#f4e2a6);color:var(--text);font-family:system-ui;padding:20px 34px 60px;}
  .osx-kick{font:700 12px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
  .osx-h2{font:700 26px/1.15 Georgia,serif;margin:0 0 8px;}
  hr{border:0;border-top:1px dashed rgba(255,255,255,.15);margin:40px 0;}

  /* --- vault CSS (mirror of the section) --- */
  #p2pos .osx-vault{margin-bottom:28px;}
  #p2pos .ov-head{margin-bottom:16px;}
  #p2pos .ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px;}
  #p2pos .ov-grid--two{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
  #p2pos .ov-card{border:1px solid var(--stroke);border-radius:16px;padding:18px 18px 16px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(9,17,24,.4));}
  #p2pos .ov-card-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;font:700 13px/1 system-ui;color:var(--text);}
  #p2pos .ov-card-head .ov-ic{font-size:16px;}
  #p2pos .ov-card-head .ov-count{margin-left:auto;font:800 11px/1 system-ui;color:#0a1410;background:linear-gradient(145deg,#f4e2a6,var(--gold));padding:4px 8px;border-radius:20px;}
  #p2pos .ov-kit-name{font:700 16px/1.2 Georgia,serif;color:var(--gold-bright);margin-bottom:10px;}
  #p2pos .ov-swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  #p2pos .ov-swatch{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.18);}
  #p2pos .ov-kit-voice{font:400 12.5px/1.5 system-ui;color:var(--muted);margin-bottom:12px;}
  #p2pos .ov-kit-voice i{color:#c6d6d0;font-style:italic;}
  #p2pos .ov-link{font:700 12px/1 system-ui;color:var(--gold-bright);text-decoration:none;}
  #p2pos .ov-recent-list{display:flex;flex-direction:column;gap:2px;}
  #p2pos .ov-recent-row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;text-decoration:none;transition:background .15s;}
  #p2pos .ov-recent-row:hover{background:rgba(255,255,255,.04);}
  #p2pos .ov-chip{flex:0 0 auto;font:700 9.5px/1 system-ui;letter-spacing:.03em;text-transform:uppercase;color:var(--gold);background:rgba(216,180,90,.12);border:1px solid var(--gstroke);border-radius:20px;padding:5px 8px;}
  #p2pos .ov-recent-text{flex:1;min-width:0;font:500 13px/1.35 system-ui;color:#dbe7e2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #p2pos .ov-recent-time{flex:0 0 auto;font:500 11px/1 system-ui;color:var(--muted);}
  #p2pos .ov-mini-list{display:flex;flex-direction:column;gap:6px;}
  #p2pos .ov-mini-row{display:block;padding:9px 11px;border:1px solid var(--stroke);border-radius:10px;text-decoration:none;transition:border-color .15s,background .15s;}
  #p2pos .ov-mini-row:hover{border-color:var(--gstroke);background:rgba(255,255,255,.03);}
  #p2pos .ov-mini-row b{display:block;font:700 13px/1.25 system-ui;color:var(--text);}
  #p2pos .ov-mini-row span{display:block;margin-top:2px;font:400 11.5px/1.4 system-ui;color:var(--muted);}
  #p2pos .ov-totals{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--stroke);border-radius:14px;background:rgba(255,255,255,.02);}
  #p2pos .ov-totals-lead{font:700 13px/1.3 system-ui;color:var(--text);}
  #p2pos .ov-total-chips{display:flex;flex-wrap:wrap;gap:8px;}
  #p2pos .ov-total-chip{display:flex;align-items:baseline;gap:6px;padding:6px 11px;border:1px solid var(--stroke);border-radius:20px;text-decoration:none;}
  #p2pos .ov-total-chip b{font:800 14px/1 system-ui;color:var(--gold-bright);}
  #p2pos .ov-total-chip span{font:600 11px/1 system-ui;color:var(--muted);}
  #p2pos .ov-empty{max-width:520px;margin:10px 0;padding:26px 24px;border:1px dashed var(--gstroke);border-radius:18px;background:rgba(216,180,90,.05);}
  #p2pos .ov-empty-ic{font-size:32px;margin-bottom:10px;}
  #p2pos .ov-empty b{display:block;font:700 17px/1.2 Georgia,serif;color:var(--text);margin-bottom:6px;}
  #p2pos .ov-empty p{margin:0 0 12px;font:400 13.5px/1.6 system-ui;color:var(--muted);}
  #p2pos .ov-empty-links a{font:700 12.5px/1 system-ui;color:var(--gold-bright);text-decoration:none;}
</style>
</head><body>
<div id="p2pos">
  <p style="color:#8aa0a6;font:700 11px/1 system-ui;letter-spacing:.1em;text-transform:uppercase;">Populated state</p>
  <div class="osx-vault" data-vault-full></div>
  <hr>
  <p style="color:#8aa0a6;font:700 11px/1 system-ui;letter-spacing:.1em;text-transform:uppercase;">Empty state (new member)</p>
  <div class="osx-vault" data-vault-empty></div>
</div>
<script src="../assets/p2p-os-vault.js"></script>
<script>
  var now = Date.now();
  // synthetic data matching the real key shapes
  localStorage.setItem('blackSheepBrandKitVault', JSON.stringify({ brandHausKits:[{ name:"Rooted & Rising", colors:["#2b4a6f","#c9a24a","#efe7d6","#7a2848","#3a7d5a"], voice:"Warm, grounded, quietly confident" }] }));
  localStorage.setItem('brandHausRecentLog', JSON.stringify([{ id:'a', text:"Brand card — 'Rooted & Rising'", mode:"brandcard", loggedAt: now-3600e3 }]));
  localStorage.setItem('graphicsHausRecentLog', JSON.stringify([{ id:'b', text:"Instagram carousel — 5 slides", mode:"carousel", loggedAt: now-7200e3 }]));
  localStorage.setItem('marketingHausRecentLog', JSON.stringify([{ id:'c', text:"Welcome email sequence (3 parts)", mode:"email", loggedAt: now-2*86400e3 }]));
  localStorage.setItem('promptHausRecentLog', JSON.stringify([{ id:'d', text:"Product description — evergreen", mode:"desc", loggedAt: now-5*86400e3 }]));
  localStorage.setItem('graphicsHausLookLocks', JSON.stringify({ looks:[{ name:"Cozy Cottage", fields:{ artStyle:"Watercolor", palette:"Sage & cream", mood:"Calm" }}], activeLookId:null }));
  localStorage.setItem('marketingHausLookLocks', JSON.stringify({ looks:[{ name:"Bold Launch", fields:{ artStyle:"Flat vector", palette:"Plum & gold" }}] }));
  localStorage.setItem('graphicsHausMascotLocks', JSON.stringify({ mascots:[{ name:"Goose", fields:{ species:"Sheep", artStyle:"3D cartoon" }}] }));
  localStorage.setItem('brandHausFavorites', JSON.stringify({ brandcard:[{},{}], tagline:[{}] }));
  localStorage.setItem('graphicsHausBrandKits', JSON.stringify({ kits:[{},{}] }));

  window.P2POSVault.mount(document.querySelector('[data-vault-full]'));

  // empty state: clear everything, then mount
  ['blackSheepBrandKitVault','brandHausRecentLog','graphicsHausRecentLog','marketingHausRecentLog','promptHausRecentLog','productHausRecentLog','graphicsHausLookLocks','marketingHausLookLocks','productHausLookLocks','graphicsHausMascotLocks','brandHausFavorites','promptHausFavorites','graphicsHausFavorites','productHausFavorites','marketingHausFavorites','brandHausBrandKits','graphicsHausBrandKits','promptHausBrandKits','productHausBrandKits','marketingHausBrandKits'].forEach(function(k){ localStorage.removeItem(k); });
  window.P2POSVault.mount(document.querySelector('[data-vault-empty]'));

  // restore full data so a reload still shows populated (harness convenience)
  localStorage.setItem('blackSheepBrandKitVault', JSON.stringify({ brandHausKits:[{ name:"Rooted & Rising", colors:["#2b4a6f","#c9a24a","#efe7d6","#7a2848","#3a7d5a"], voice:"Warm, grounded, quietly confident" }] }));
</script>
</body></html>
