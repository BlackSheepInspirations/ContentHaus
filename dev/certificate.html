<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Certificate — P2P Learning Journey</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#0a0f0c; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;
    font-family:Georgia,serif;}
  .cert{position:relative; max-width:960px; width:100%; box-shadow:0 24px 70px rgba(0,0,0,.6); line-height:0;}
  .cert img{width:100%; display:block;}

  /* overlaid fields (crisp, editable, per-student) */
  .fld{position:absolute; transform:translate(-50%,-50%); text-align:center; color:#14294f; line-height:1;}
  .name{left:50%; top:55.6%; width:74%; font-family:"Snell Roundhand","Brush Script MT",cursive;
    font-weight:600; font-size:clamp(28px,6vw,60px); color:#132a54;}
  .course{left:50%; top:66%; width:76%; font-family:Georgia,serif; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; font-size:clamp(15px,2.5vw,26px); color:#173056;}
  /* suggested additions (see note) — pushed out toward the edges */
  .date{left:11%; top:72%; font-family:Georgia,serif; font-style:italic; font-size:clamp(9px,1.4vw,14px); color:#3a4d70;}
  .cid{left:89%; top:72%; font-family:Georgia,serif; font-size:clamp(8px,1.3vw,13px); letter-spacing:.06em; color:#3a4d70;}
</style>
</head>
<body>
  <div class="cert">
    <img src="cert-bg.png" alt="Certificate of Completion" />
    <div class="fld name">Jordan Rivera</div>
    <div class="fld course">Quick Wins That Count</div>
    <div class="fld date">Awarded July 28, 2026</div>
    <div class="fld cid">ID · P2P&#8209;2026&#8209;8J2UPC</div>
  </div>
</body>
</html>
